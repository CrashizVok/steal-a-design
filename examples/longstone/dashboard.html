<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Longstone — lane console</title>
<meta name="description" content="Lane console for Longstone: temperature trace against the lot's stability envelope, custody events, and the hold queue.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f4;
  --surface:#f2f1ed;
  --raised:#ebeae5;
  --ink:#26251e;
  --ink-rgb:38 37 30;
  --muted:#65645e;
  --accent:#34785c;
  --line:rgb(38 37 30 / .1);
  --line-strong:rgb(38 37 30 / .2);
  --dark:#13111c;
  --dark-raised:#181622;
  --dark-line:#33323e;
  --dark-muted:#a1a0ab;
  --r-sm:4px;
  --r-md:8px;
  --r-panel:20px;
  --display:"EB Garamond",Georgia,"Times New Roman",serif;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 14px/1.5 var(--body);-webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.label{font:500 10.5px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.card>header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card>header .label:first-child{margin-inline-end:auto}

/* app bar */
.appbar{border-bottom:1px solid var(--line);background:var(--bg)}
.appbar .in{display:flex;align-items:center;gap:20px;height:60px;padding-inline:22px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;flex:none}
.brand .mark{width:15px;height:15px;border-radius:3px;background:var(--accent);box-shadow:inset 0 -4px 0 rgb(255 255 255 / .28)}
.brand .name{font:500 20px/1 var(--display);letter-spacing:-.01em}
.search{flex:1;max-width:340px;position:relative}
.search input{width:100%;padding:8px 12px 8px 30px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-size:13px}
.search input::placeholder{color:var(--muted)}
.search::before{content:"";position:absolute;left:11px;top:50%;width:9px;height:9px;margin-top:-6px;border:1.5px solid var(--muted);border-radius:50%}
.appbar .right{margin-inline-start:auto;display:flex;align-items:center;gap:14px;flex:none}
.live{display:inline-flex;align-items:center;gap:7px;font:500 11px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:block}
.back{font-size:13px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}

/* shell */
.app{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:calc(100% - 61px)}

/* lane column */
.lanes{border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.filters{display:flex;gap:6px;padding:14px 16px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 11px;font:500 11.5px/1 var(--body);color:var(--muted);cursor:pointer;letter-spacing:.02em}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lane-list{list-style:none;margin:0;padding:8px;overflow:auto;flex:1;display:grid;gap:2px;align-content:start}
.lane{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;
  background:transparent;border:1px solid transparent;border-radius:var(--r-md);padding:11px 12px;text-align:start;cursor:pointer}
.lane:hover{background:var(--surface)}
.lane[aria-current="true"]{background:var(--surface);border-color:var(--line-strong)}
.lane .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:2px}
.lane[data-state="excursion"] .dot{background:var(--ink)}
.lane[data-state="hold"] .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}
.lane b{display:block;font:500 13.5px/1.3 var(--body);font-variant-numeric:tabular-nums}
.lane small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane .deg{font:500 13px/1 var(--mono);font-variant-numeric:tabular-nums}
.empty{margin:24px 16px;font-size:13px;color:var(--muted);line-height:1.6}

/* detail */
.detail{padding:26px clamp(18px,3vw,34px) 40px;min-width:0}
.d-head{display:flex;align-items:flex-end;gap:24px;padding-bottom:20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.d-head h1{font:400 clamp(26px,3vw,34px)/1.1 var(--display);letter-spacing:-.01em;margin:6px 0 0}
.d-head .sub{margin-top:6px;font-size:13px;color:var(--muted)}
.d-head .right{margin-inline-start:auto;display:flex;align-items:flex-end;gap:22px}
.now{font:400 30px/1 var(--display);font-variant-numeric:tabular-nums}
.now span{font-size:16px;color:var(--muted);margin-inline-start:2px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 11px;font:500 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line-strong)}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
.pill.alert{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.alert::before{background:var(--bg)}
.pill.quiet::before{background:transparent;box-shadow:inset 0 0 0 1px var(--ink)}

.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;margin-top:22px;align-items:start}
.stack{display:grid;gap:16px}

/* chart */
.switch{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.switch button{background:transparent;border:0;padding:6px 10px;font:500 11px/1 var(--body);letter-spacing:.04em;color:var(--muted);cursor:pointer}
.switch button+button{border-inline-start:1px solid var(--line)}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chart{padding:8px 10px 0}
.chart svg{display:block;width:100%;height:auto}
.chart svg text{font-family:var(--mono)}
.trace-foot{display:flex;flex-wrap:wrap;gap:6px 18px;padding:4px 16px 14px;font:500 11.5px/1.4 var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.trace-foot b{color:var(--ink);font-weight:500}

/* holds */
.hold{display:grid;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.hold:last-child{border-bottom:0}
.hold .top{display:flex;align-items:baseline;gap:10px}
.hold .code{font:500 11px/1 var(--mono);letter-spacing:.04em;color:var(--accent)}
.hold .when{margin-inline-start:auto;font:500 11px/1 var(--mono);color:var(--muted)}
.hold p{margin:0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.release{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.release select{flex:1;min-width:140px;padding:7px 8px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);font-size:12.5px}
.release button{padding:7px 12px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:var(--r-sm);font:500 12px/1.2 var(--body);cursor:pointer}
.release button:disabled{opacity:.35;cursor:not-allowed}
.done{padding:16px;font-size:13px;color:var(--muted);line-height:1.6}

/* custody */
.ev{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ev th{text-align:left;font:500 10.5px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line)}
.ev td{padding:11px 16px;font-size:13px;border-bottom:1px solid var(--line)}
.ev tr:last-child td{border-bottom:0}
.ev td.t{font:500 12px/1 var(--mono);color:var(--muted)}
.ev td.sig{font:500 12px/1 var(--mono);color:var(--muted)}
.ev tr.gap td{color:var(--muted);background:rgb(38 37 30 / .025)}
.ev tr.gap td.sig::before{content:"no scan";font:500 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase}
.ev .ok{color:var(--accent);font:500 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;margin-inline-start:8px}

/* log */
.log ol{list-style:none;margin:0;padding:6px 0}
.log li{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:12px;padding:9px 16px;font-size:12.5px;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log .t{font:500 11px/1.5 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.log .d{font:500 11px/1.5 var(--mono);color:var(--accent)}
.log .m{color:var(--ink);min-width:0}
.log li.none{display:block;color:var(--muted)}

@media (max-width:1080px){
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .lanes{border-inline-end:0;border-bottom:1px solid var(--line)}
  .lane-list{max-height:230px}
  .appbar .in{gap:12px;padding-inline:16px}
  .search{max-width:none}
  .live{display:none}
  .d-head .right{margin-inline-start:0;width:100%;justify-content:space-between}
  .log li{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"t m" "d m"}
  .log .t{grid-area:t}.log .d{grid-area:d}.log .m{grid-area:m}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="appbar">
  <div class="in">
    <a class="brand" href="index.html"><span class="mark" aria-hidden="true"></span><span class="name">Longstone</span></a>
    <div class="search">
      <label class="sr" for="q">Search lanes</label>
      <input id="q" type="search" placeholder="Lot, route, carrier" autocomplete="off">
    </div>
    <div class="right">
      <span class="live"><i aria-hidden="true"></i>EPCIS live</span>
      <a class="back" href="index.html">Back to site</a>
    </div>
  </div>
</header>

<div class="app">
  <aside class="lanes" aria-label="Lanes">
    <div class="filters" role="group" aria-label="Filter lanes">
      <button class="chip" data-filter="all" aria-pressed="true">All</button>
      <button class="chip" data-filter="ok" aria-pressed="false">In envelope</button>
      <button class="chip" data-filter="excursion" aria-pressed="false">Excursion</button>
      <button class="chip" data-filter="hold" aria-pressed="false">Hold</button>
    </div>
    <ul class="lane-list" id="lanes"></ul>
    <p class="empty" id="empty" hidden>No lane matches that filter.</p>
  </aside>

  <main class="detail" id="detail"></main>
</div>

<script>
// Demo data. Deterministic per lane and range, so the chart never changes under the reader.
const SEED = (s) => {
  let h = 2166136261;
  for (const c of s) h = (h ^ c.charCodeAt(0)) * 16777619;
  return () => ((h = (h * 16807) % 2147483647) / 2147483647);
};

const lanes = [
  { id: 'PX-8841', sku: 'VAR-02', route: 'Rotterdam → Basel', carrier: 'DHL Medical', band: [2, 8], base: 5.1, amp: 0.7, phase: 0, state: 'ok',
    holds: [],
    events: [['04:12', 'Rotterdam, NL', '7f3a…c1', true], ['11:47', 'Basel, CH', '2d90…8e', true], ['19:03', 'Lyon, FR', '', false], ['22:30', 'Lyon, FR', 'b415…44', true]] },
  { id: 'PX-8842', sku: 'BIO-11', route: 'Basel → Lyon', carrier: 'Kuehne+Nagel', band: [2, 8], base: 6.4, amp: 0.9, phase: 1.6, state: 'excursion',
    holds: [{ code: 'EXC-T8', at: '19:03', text: '18 minutes above 8.0 °C at Lyon cross-dock, probe 2 of 3.' }],
    events: [['05:40', 'Basel, CH', 'a1c2…09', true], ['13:22', 'Mulhouse, FR', 'ce77…1b', true], ['19:03', 'Lyon, FR', '9f04…dd', true]] },
  { id: 'PX-8850', sku: 'EXC-04', route: 'Dublin → Manchester', carrier: 'UPS Healthcare', band: [15, 25], base: 20.4, amp: 1.2, phase: 3.1, state: 'ok',
    holds: [],
    events: [['02:15', 'Dublin, IE', '31bb…7a', true], ['09:48', 'Holyhead, UK', '7e10…c4', true], ['16:02', 'Manchester, UK', 'd882…12', true]] },
  { id: 'PX-8863', sku: 'VAR-07', route: 'Lyon → Milan', carrier: 'DB Schenker', band: [2, 8], base: 4.2, amp: 0.6, phase: 4.4, state: 'hold',
    holds: [{ code: 'EXC-T2', at: '11:26', text: 'Dropped to 1.4 °C for 9 minutes in the Fréjus tunnel, probe 1.' },
            { code: 'SIG-MISS', at: '11:26', text: 'Handoff signature missing at the tunnel exit read point.' }],
    events: [['06:05', 'Lyon, FR', '5b2e…31', true], ['11:26', 'Fréjus, FR', '', false], ['15:40', 'Milan, IT', '', false]] },
  { id: 'PX-8871', sku: 'BIO-11', route: 'Frankfurt → Vienna', carrier: 'Lufthansa Cargo', band: [2, 8], base: 5.6, amp: 0.5, phase: 5.2, state: 'ok',
    holds: [],
    events: [['07:30', 'Frankfurt, DE', 'c0a4…56', true], ['12:14', 'Linz, AT', '18fe…92', true], ['17:55', 'Vienna, AT', '4a63…b0', true]] },
];

const excursions = { 'PX-8842': [{ at: 17, delta: 2.2 }], 'PX-8863': [{ at: 9, delta: -2.4 }] };

const stateLabel = { ok: 'In envelope', excursion: 'Excursion', hold: 'Hold' };
const statePill = { ok: 'pill', excursion: 'pill alert', hold: 'pill quiet' };

let activeId = lanes[0].id;
let filter = 'all';
let query = '';
let range = '24h';
const log = [];

const $ = (sel, root = document) => root.querySelector(sel);

function times(n) {
  const step = range === '6h' ? 0.5 : range === '24h' ? 1 : 3;
  const start = 24 - n * step;
  return Array.from({ length: n }, (_, i) => {
    const h = (start + i * step + 24) % 24;
    const hh = String(Math.floor(h)).padStart(2, '0');
    const mm = h % 1 ? '30' : '00';
    return `${hh}:${mm}`;
  });
}

function seriesFor(lane) {
  const n = range === '72h' ? 24 : range === '24h' ? 24 : 12;
  const rnd = SEED(lane.id + range);
  const points = Array.from({ length: n }, (_, i) => {
    let v = lane.base + Math.sin(i / 2.4 + lane.phase) * lane.amp + (rnd() - 0.5) * 0.6;
    const hit = (excursions[lane.id] || []).find((e) => e.at === i);
    if (hit) v += hit.delta;
    return Math.round(v * 10) / 10;
  });
  return { points, labels: times(n) };
}

function visibleLanes() {
  return lanes.filter((l) => {
    const inFilter = filter === 'all' || l.state === filter;
    const q = query.trim().toLowerCase();
    const inQuery = !q || [l.id, l.route, l.carrier, l.sku].join(' ').toLowerCase().includes(q);
    return inFilter && inQuery;
  });
}

function laneTemp(l) {
  const s = seriesFor(l).points;
  return s[s.length - 1];
}

function renderLanes() {
  const list = $('#lanes');
  const shown = visibleLanes();
  list.innerHTML = shown.map((l) => `
    <li>
      <button class="lane" data-id="${l.id}" data-state="${l.state}" aria-current="${l.id === activeId}">
        <span class="dot" aria-hidden="true"></span>
        <span><b>${l.id}</b><small>${l.route}</small></span>
        <span class="deg">${laneTemp(l).toFixed(1)}°</span>
      </button>
    </li>`).join('');
  $('#empty').hidden = shown.length > 0;
  list.querySelectorAll('.lane').forEach((btn) => {
    btn.addEventListener('click', () => { activeId = btn.dataset.id; renderLanes(); renderDetail(); });
  });
}

function chart(lane) {
  const { points, labels } = seriesFor(lane);
  const [lo, hi] = lane.band;
  const W = 720, H = 220, padL = 40, padR = 14, padT = 16, padB = 28;
  const floor = Math.min(lo, ...points) - 1.2;
  const ceil = Math.max(hi, ...points) + 1.2;
  const x = (i) => padL + (i / (points.length - 1)) * (W - padL - padR);
  const y = (v) => padT + (1 - (v - floor) / (ceil - floor)) * (H - padT - padB);
  const line = points.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const out = points.map((v, i) => ({ v, i })).filter(({ v }) => v < lo || v > hi);
  const ticks = [lo, (lo + hi) / 2, hi];
  const every = Math.ceil(labels.length / 6);

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Temperature trace for lot ${lane.id}, envelope ${lo} to ${hi} degrees Celsius, ${out.length} reading${out.length === 1 ? '' : 's'} outside the band.">
    <rect x="${padL}" y="${y(hi).toFixed(1)}" width="${W - padL - padR}" height="${(y(lo) - y(hi)).toFixed(1)}" fill="var(--accent)" opacity=".08"/>
    ${ticks.map((t) => `<line x1="${padL}" x2="${W - padR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--line-strong)" stroke-dasharray="${t === lo || t === hi ? '0' : '3 4'}"/>
      <text x="${padL - 8}" y="${(y(t) + 3.5).toFixed(1)}" text-anchor="end" font-family="var(--mono)" font-size="10" fill="var(--muted)">${t}°</text>`).join('')}
    <path d="${line}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    ${out.map(({ v, i }) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.2" fill="var(--ink)"/>
      <text x="${x(i).toFixed(1)}" y="${(y(v) - 9).toFixed(1)}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--ink)">${v.toFixed(1)}°</text>`).join('')}
    ${labels.map((t, i) => i % every === 0 ? `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--muted)">${t}</text>` : '').join('')}
  </svg>`;
}

function holds(lane) {
  if (!lane.holds.length) {
    return `<p class="done">No open hold on this lane. Release is signed and appended by a quality user when one exists.</p>`;
  }
  return lane.holds.map((h, i) => `
    <div class="hold">
      <div class="top"><span class="code">${h.code}</span><span class="when">${h.at}</span></div>
      <p>${h.text}</p>
      <div class="release">
        <label class="sr" for="r-${lane.id}-${i}">Reason code for ${h.code}</label>
        <select id="r-${lane.id}-${i}" data-hold="${i}">
          <option value="">Select a reason code</option>
          <option>Product assessed, in tolerance</option>
          <option>Data gap resolved from carrier log</option>
          <option>Envelope revised by QA</option>
          <option>Lot rejected, destroyed</option>
        </select>
        <button type="button" data-release="${i}" disabled>Sign off and release</button>
      </div>
    </div>`).join('');
}

function renderDetail() {
  const lane = lanes.find((l) => l.id === activeId);
  const { points } = seriesFor(lane);
  const [lo, hi] = lane.band;
  const min = Math.min(...points).toFixed(1);
  const max = Math.max(...points).toFixed(1);
  const out = points.filter((v) => v < lo || v > hi).length;

  $('#detail').innerHTML = `
    <div class="d-head">
      <div>
        <p class="label">Lot</p>
        <h1>${lane.id}</h1>
        <p class="sub">${lane.sku} · ${lane.route} · ${lane.carrier}</p>
      </div>
      <div class="right">
        <div>
          <p class="label">Now</p>
          <p class="now">${points[points.length - 1].toFixed(1)}<span>°C</span></p>
        </div>
        <span class="${statePill[lane.state]}">${stateLabel[lane.state]}</span>
      </div>
    </div>

    <div class="grid2">
      <div class="stack">
        <section class="card">
          <header>
            <p class="label">Temperature trace</p>
            <div class="switch" role="group" aria-label="Range">
              ${['6h', '24h', '72h'].map((r) => `<button data-range="${r}" aria-pressed="${r === range}">${r}</button>`).join('')}
            </div>
          </header>
          <div class="chart">${chart(lane)}</div>
          <div class="trace-foot">
            <span>Envelope <b>${lo.toFixed(1)}–${hi.toFixed(1)} °C</b></span>
            <span>Min <b>${min}</b></span>
            <span>Max <b>${max}</b></span>
            <span>Outside band <b>${out}</b></span>
          </div>
        </section>

        <section class="card">
          <header><p class="label">Custody events</p><p class="label">${lane.events.length} scans</p></header>
          <table class="ev">
            <thead><tr><th scope="col">Time</th><th scope="col">Read point</th><th scope="col">Seal</th></tr></thead>
            <tbody>${lane.events.map(([t, where, sig, ok]) => `
              <tr class="${ok ? '' : 'gap'}">
                <td class="t">${t}</td>
                <td>${where}</td>
                <td class="sig">${ok ? `${sig}<span class="ok">signed</span>` : ''}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </section>
      </div>

      <div class="stack">
        <section class="card">
          <header><p class="label">Envelope</p></header>
          <div class="trace-foot" style="padding:14px 16px">
            <span>SKU <b>${lane.sku}</b></span>
            <span>Band <b>${lo}–${hi} °C</b></span>
            <span>Route <b>${lane.route}</b></span>
            <span>Open holds <b>${lane.holds.length}</b></span>
          </div>
        </section>

        <section class="card" id="holds">
          <header><p class="label">Hold queue</p><p class="label">${lane.holds.length} open</p></header>
          ${holds(lane)}
        </section>

        <section class="card log">
          <header><p class="label">Audit trail</p><p class="label">append only</p></header>
          <ol id="log">${log.length ? log.map((e) => `<li><span class="t">${e.t}</span><span class="d">${e.d}</span><span class="m">${e.m}</span></li>`).join('') : '<li class="none">Releases and hold decisions land here, newest first.</li>'}</ol>
        </section>
      </div>
    </div>`;

  $('#detail').querySelectorAll('[data-range]').forEach((btn) => {
    btn.addEventListener('click', () => { range = btn.dataset.range; renderDetail(); });
  });

  $('#detail').querySelectorAll('[data-hold]').forEach((sel) => {
    sel.addEventListener('change', () => {
      const btn = sel.parentElement.querySelector('button');
      btn.disabled = !sel.value;
    });
  });

  $('#detail').querySelectorAll('[data-release]').forEach((btn) => {
    btn.addEventListener('click', () => release(lane, Number(btn.dataset.release), btn.parentElement.querySelector('select')));
  });
}

function release(lane, index, select) {
  const hold = lane.holds[index];
  const reason = select.value;
  if (!reason) return;
  lane.holds.splice(index, 1);
  lane.events = lane.events.map((e) => (e[3] ? e : [e[0], e[1], 'released', true]));
  if (!lane.holds.length && lane.state !== 'ok') lane.state = 'ok';
  const now = new Date();
  const stamp = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  const digest = Math.random().toString(16).slice(2, 6) + '…' + Math.random().toString(16).slice(2, 4);
  log.unshift({ t: stamp, d: digest, m: `<b>${lane.id}</b> · ${hold.code} released · ${reason}` });
  renderLanes();
  renderDetail();
  const live = document.createElement('p');
  live.className = 'sr';
  live.setAttribute('role', 'status');
  live.textContent = `Hold ${hold.code} on ${lane.id} released.`;
  $('#detail').appendChild(live);
}

$('#q').addEventListener('input', (e) => { query = e.target.value; renderLanes(); });
document.querySelectorAll('.chip').forEach((chip) => {
  chip.addEventListener('click', () => {
    filter = chip.dataset.filter;
    document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c === chip)));
    renderLanes();
  });
});

renderLanes();
renderDetail();
</script>
</body>
</html>
